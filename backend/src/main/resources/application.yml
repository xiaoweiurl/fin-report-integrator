server:
  port: 18443

spring:
  application:
    name: fin-report
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finreport}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.cairui.finreport
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

app:
  jwt:
    secret: "fin-report-demo-secret-change-me-please-32bytes!"
    expire-hours: 24
  cors:
    origins: "http://127.0.0.1:43123,http://localhost:43123"
